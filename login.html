<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pharmacy Management System</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="/config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🏥 PharmaTrack</h1>
                <p>AI-Powered Inventory & Sales Management</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="form-section active">
                <h2>Welcome Back</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="loginEmail">Email or Username</label>
                        <input type="text" id="loginEmail" placeholder="Enter your email or username" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="switch-form">
                    New pharmacy? <a href="/register-org" style="font-weight: bold;">Register your organization</a>
                </p>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
