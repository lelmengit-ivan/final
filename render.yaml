services:
  # Web Service
  - type: web
    name: pharmacy-system
    env: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: pharmacy-db
    databaseName: pharmacy_db
    user: pharmacy_user
